<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuyi — Legal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;color:#1a1a1a;background:#fff}
.container{max-width:760px;margin:0 auto;padding:60px 20px}
h1{font-size:1.8rem;margin-bottom:16px}
p{margin:8px 0;color:#333}
.links{margin:28px 0}
.links a{display:inline-block;margin:6px 12px 6px 0;padding:8px 18px;border:1px solid #ccc;border-radius:6px;text-decoration:none;color:#333;font-size:1rem;transition:border-color .15s,color .15s}
.links a:hover{border-color:#333;color:#111}
.contact{margin-top:28px;color:#555;font-size:.95rem}
.contact a{color:#333}
hr{border:none;border-top:1px solid #eee;margin:32px 0}
.no-js{}
@media(prefers-color-scheme:dark){body{background:#1a1a1a;color:#e0e0e0}h1{color:#f0f0f0}p{color:#ccc}.links a{border-color:#555;color:#ccc}.links a:hover{border-color:#999;background:#2a2a2a}.contact{color:#888}.contact a{color:#8ab4f8}hr{border-top-color:#333}}
@media(max-width:600px){.container{padding:40px 16px}h1{font-size:1.4rem}}
</style>
</head>
<body>
<div class="container">
<h1>Nuyi</h1>
<p>Legal information for the Nuyi app.</p>
<div class="links">
<a href="privacy.html">Privacy Notice</a>
<a href="terms.html">Terms &amp; Conditions</a>
</div>
<hr>
<div class="contact">
<p>Support: <a href="mailto:support@nuyi.app">support@nuyi.app</a></p>
</div>
</div>
</body>
</html>
